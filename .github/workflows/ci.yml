name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Version is pinned: upgrading golangci-lint upgrades its linters too,
      # and a CI that starts failing without any code change is a CI nobody
      # trusts. Bump it deliberately alongside .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  shell:
    name: Zsh completion widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Test the completion widget
        run: zsh shell/kubectl_fzf_test.zsh
