# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:

- id: "kubectl-fzf-server"
  main: cmd/kubectl-fzf-server/main.go
  binary: kubectl-fzf-server
  env:
    - CGO_ENABLED=0
  ldflags:
    - -X 'main.goVersion={{.Env.GO_VERSION}}' -X main.gitCommit={{.Commit}} -X main.gitBranch={{.Tag}} -X main.buildDate={{.Date}} -X main.version={{.Version}}
  goos:
    - darwin
    - linux
  goarch:
    - amd64
    - arm64

- id: "kubectl-fzf-completion"
  main: cmd/kubectl-fzf-completion/main.go
  binary: kubectl-fzf-completion
  env:
    - CGO_ENABLED=0
  ldflags:
    - -X 'main.goVersion={{.Env.GO_VERSION}}' -X main.gitCommit={{.Commit}} -X main.gitBranch={{.Tag}} -X main.buildDate={{.Date}} -X main.version={{.Version}}
  goos:
    - darwin
    - linux
  goarch:
    - amd64
    - arm64

archives:
- id: kubectl-fzf
  files:
    - README.md
    - LICENSE
    - shell/kubectl_fzf.plugin.zsh
    - shell/kubectl_fzf.bash
    - shell/kubectl_fzf.fish
  name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# Multi-arch images via buildx; built context has $TARGETPLATFORM/<binary>.
# In --snapshot runs images get a per-platform suffix and are not pushed.
dockers_v2:
  - ids:
      - kubectl-fzf-server
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/rooty0/kubectl-fzf
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "latest"
    annotations:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.url": "https://github.com/rooty0/kubectl-fzf"
      "org.opencontainers.image.source": "https://github.com/rooty0/kubectl-fzf"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": '{{ time "2006-01-02T15:04:05Z07:00" }}'
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.licenses": "MIT"

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  github:
    owner: rooty0
    name: kubectl-fzf
  draft: true
  prerelease: auto
  name_template: "v{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
